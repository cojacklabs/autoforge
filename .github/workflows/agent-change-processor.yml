name: Knowledge Planning Validation

on:
  pull_request:
    paths:
      - ".github/workflows/agent-change-processor.yml"
      - "src/intent/**"
      - "src/planning/**"
      - "src/specifications/**"
      - "src/knowledge/**"
      - "src/commands/intent.ts"
      - "src/commands/knowledge.ts"
      - "src/commands/planning.ts"
      - "docs/planning/0.8/**"
      - "test/intent/**"
      - "test/intent-command.test.ts"
      - "test/planning/**"
      - "test/context-resolver.test.ts"
      - "test/context-packet.test.ts"
      - "test/knowledge-*.test.ts"
      - "docs/planning/0.14/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-change-processor.yml"
      - "src/intent/**"
      - "src/planning/**"
      - "src/specifications/**"
      - "src/knowledge/**"
      - "docs/planning/0.8/**"
      - "docs/planning/0.14/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate formatting
        run: pnpm run format:check

      - name: Validate types
        run: pnpm workspace:typecheck

      - name: Run knowledge and context tests
        run: >-
          pnpm exec vitest run test/intent test/intent-command.test.ts test/planning
          test/context-resolver.test.ts test/context-packet.test.ts --maxWorkers=4
