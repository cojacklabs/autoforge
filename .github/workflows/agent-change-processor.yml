name: Knowledge Planning Validation

on:
  pull_request:
    paths:
      - "src/intent/**"
      - "src/planning/**"
      - "src/specifications/**"
      - "src/commands/intent.ts"
      - "src/commands/knowledge.ts"
      - "src/commands/planning.ts"
      - "docs/planning/0.8/**"
      - "test/intent/**"
      - "test/intent-command.test.ts"
      - "test/planning/**"
      - "test/context-resolver.test.ts"
      - "test/context-packet.test.ts"
  push:
    branches: [main]
    paths:
      - "src/intent/**"
      - "src/planning/**"
      - "src/specifications/**"
      - "docs/planning/0.8/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate formatting
        run: npm run format:check

      - name: Validate types
        run: npm run typecheck

      - name: Run knowledge and context tests
        run: >-
          npx vitest run test/intent test/intent-command.test.ts test/planning
          test/context-resolver.test.ts test/context-packet.test.ts --maxWorkers=4
