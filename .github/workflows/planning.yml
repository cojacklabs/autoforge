name: Planning Validation

on:
  pull_request:
    paths:
      - "dev/AutoForge_Foundation.md"
      - "dev/AutoForge_Development_Roadmap_0.8-0.10.md"
      - "dev/Design_Specification_Standard.md"
      - "dev/Codex_Implementation_Plan_0.8-0.10.md"
      - "dev/AutoForge_Planning_Bundle.md"
      - "scripts/check_planning_bundle.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/planning.yml"
  push:
    branches: [main]
    paths:
      - "dev/**"
      - "scripts/check_planning_bundle.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm workspace:planning:check
