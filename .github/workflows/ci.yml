name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Smoke test packed package
        run: |
          PACKAGE=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          SMOKE_DIR="$RUNNER_TEMP/autoforge-package-smoke"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/$PACKAGE" --ignore-scripts
          npx autoforge version
          npx autoforge help >/dev/null
