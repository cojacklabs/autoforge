name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  affected-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js 22
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace imports
        run: pnpm exec turbo boundaries

      - name: Check AutoForge dependency policy
        run: node packages/config/src/check-boundaries.mjs

      - name: Validate affected packages
        run: pnpm exec turbo run build typecheck test format:check boundaries --affected

  core-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm and Node.js 22
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Core
        run: pnpm workspace:typecheck

      - name: Run full Core compatibility suites
        run: pnpm workspace:test

      - name: Check Core formatting
        run: pnpm workspace:format:check

      - name: Check planning synchronization
        run: pnpm workspace:planning:check

      - name: Smoke test packed package
        run: |
          PACKAGE=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          SMOKE_DIR="$RUNNER_TEMP/autoforge-package-smoke"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/$PACKAGE" --ignore-scripts
          npx autoforge version
          npx autoforge help >/dev/null
