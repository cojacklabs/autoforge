name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  affected-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source imports and AutoForge dependency policy
        run: node packages/config/src/check-boundaries.mjs

      - name: Validate affected packages
        run: pnpm exec turbo run build typecheck test format:check --affected

  core-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Core
        run: pnpm workspace:typecheck

      - name: Run full Core compatibility suites
        run: pnpm workspace:test

      - name: Check Core formatting
        run: pnpm workspace:format:check

      - name: Check planning synchronization
        run: pnpm workspace:planning:check

      - name: Check release metadata
        run: pnpm release:status

      - name: Build public packages in dependency order
        run: |
          pnpm --filter @cojacklabs/autoforge-protocol build
          pnpm --filter @cojacklabs/autoforge-core build
          pnpm --filter @cojacklabs/autoforge-sdk build
          pnpm build

      - name: Smoke test packed public package set
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/autoforge-package-artifacts"
          SMOKE_DIR="$RUNNER_TEMP/autoforge-package-smoke"
          mkdir -p "$ARTIFACT_DIR" "$SMOKE_DIR"
          pnpm --dir packages/protocol pack --pack-destination "$ARTIFACT_DIR"
          pnpm --dir packages/core pack --pack-destination "$ARTIFACT_DIR"
          pnpm --dir packages/sdk pack --pack-destination "$ARTIFACT_DIR"
          pnpm pack --pack-destination "$ARTIFACT_DIR"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "$ARTIFACT_DIR"/cojacklabs-autoforge-protocol-*.tgz \
            "$ARTIFACT_DIR"/cojacklabs-autoforge-core-*.tgz \
            "$ARTIFACT_DIR"/cojacklabs-autoforge-sdk-*.tgz \
            "$ARTIFACT_DIR"/cojacklabs-autoforge-[0-9]*.tgz
          node --input-type=module -e "await import('@cojacklabs/autoforge-protocol'); await import('@cojacklabs/autoforge-core'); await import('@cojacklabs/autoforge-sdk')"
          npx --no-install autoforge version
          npx --no-install autoforge help >/dev/null

  windows-agent-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Exercise the native Windows Agent command shim
        run: |
          pnpm exec vitest run test/agent-launcher.test.ts
          pnpm --dir packages/protocol exec vitest run test/agent-launcher.test.ts
