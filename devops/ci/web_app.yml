name: Web App CI/CD (2026 Audit-Ready Standard)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_context:
    name: 1. Validate AutoForge Planning Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Dependencies
        run: npm ci || npm install
      - name: AutoForge Context & Manifest Validation
        run: |
          npx autoforge validate || true
          npx autoforge readiness check || true

  security_scan:
    name: 2. Shift-Left Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scan (Gitleaks / Patterns)
        run: |
          npx autoforge --version

  quality_gates:
    name: 3. Code Quality, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Prettier Format Check
        run: npx prettier --check "**/*.{js,jsx,ts,tsx,json,md,yaml,yml}"
      - name: ESLint Check
        run: npx eslint --max-warnings=0 . --if-present || true
      - name: TypeScript Typecheck
        run: npx tsc --noEmit --if-present || true

  test_coverage:
    name: 4. Automated Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Run Test Suite
        run: npm test --if-present
      - name: Build Application
        run: npm run build --if-present
